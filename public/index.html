<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Películas | Usuario</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.5.10/css/pico.min.css"/>
  <style>
  body {
      background-color: #393964;
      color: #fff;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      border-bottom: 1px solid #ffffff;
    }

    header h1 {
      margin-bottom: 1px;
      color: #fff;
      font-family: 'Paradise Signature';
      font-size: 2.5rem;
    }

    nav {
      margin-top: 1rem;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 100px;
    }

    .nav-button {
      background-color: #525277;
      color: white;
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.3s, transform 0.2s;
    }

    .nav-button:hover {
      background-color: #83839e;
      transform: scale(1.05);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      padding: 1rem;
    }

    @media (min-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .movie-card {
      background: #2a2a40;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }

    .movie-card:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .movie-image {
      width: 180px;
      height: 290px;
      object-fit: cover;
    }

    .movie-details {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .movie-details p {
      font-size: 0.9rem;
      margin: 0.2rem 0;
    }

    .hover-description {
      display: none;
    }

    .movie-card:hover .hover-description {
      display: block;
      margin-top: 0.5rem;
    }

    button {
      margin-top: auto;
    }

    .search-input {
  margin: 2rem 10px;
  max-width: 200px;
  background-color: #ceced8;
  padding: 0.5rem 1.2px;
  border: none;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  width: 100%;
  color: #000;
  outline: none;
}

.search-input::placeholder {
  color: #555;
}

  </style>
</head>
<body>
  <header>
    <h1> Bienvenido a CinePlus</h1>
    <nav class="nav-buttons">
      <a href="register.html" class="nav-button">Registrarse</a>
      <a href="login.html" class="nav-button">Ingresar</a>
    </nav>
  </header>

   <div class="search-bar">
     <input type="text" placeholder="Buscar películas..." class="search-input">
  </div>

  <main class="grid-container">

  <script>

    const container = document.getElementById('moviesContainer');
    const searchInput = document.getElementById('search');

    function renderMovies(data) {
      container.innerHTML = '';
      data.forEach(movie => {
        container.innerHTML += `
          <article class="movie-card" >
            <img src="${movie.Imagen}" class="movie-image" alt="${movie.Titulo}" />
            <div class="movie-details">
              <h4>${movie.Titulo} (${movie.Anio})</h4>
              <p><strong>Actores:</strong> ${movie.Actores}</p>
              <p><strong>Categoría:</strong> ${movie.Categoria}</p>
              <p class="hover-description"><strong>Sinopsis:</strong> ${movie.Sinopsis}</p>
              <button onclick="addToList('${movie._id}')">Agregar a mi lista</button>
            </div>
          </article>`;
      });
    }

    function addToList(id) {
      alert("Película añadida a tu lista: " + id);
    }

    searchInput.addEventListener('input', () => {
      const filtered = movies.filter(m => m.Titulo.toLowerCase().includes(searchInput.value.toLowerCase()));
      renderMovies(filtered);
    });

    renderMovies(movies);
  </script>
</body>
</html>
